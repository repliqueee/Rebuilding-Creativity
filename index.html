<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebuilding Creativity — Новые Выпуски</title>
<meta name="description" content="Короткие интервью и разговоры с людьми из креативной индустрии.">
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&display=swap");

:root {
  --bg: #f2f0eb;
  --card-bg: #ffffff;
  --text-primary: #17161a;
  --text-secondary: #6b6a6f;
  --border-soft: #e6e3dc;

  --accent-pink: #f0227e;
  --accent-lime: #dcea55;
  --accent-blue: #4a5cf5;

  --pill-bg: #ececec;
  --pill-text: #48474b;

  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;

  --radius-lg: 26px;
  --radius-pill: 999px;
  --shadow-card: 0 6px 24px rgba(20, 18, 14, 0.06);
  --container-max: 1180px;
  --gutter: 20px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

.container { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); }

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px var(--gutter) 12px;
  max-width: var(--container-max);
  margin: 0 auto;
}
.site-header__brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.site-logo-box {
  width: 40px; height: 40px; border-radius: 50%;
  background: #efefef; border: 1.5px solid #1c1c1c;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  overflow: hidden; box-sizing: border-box;
}
.site-logo { width: 100%; height: 100%; object-fit: cover; }
.site-title {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: 22px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.site-title .crumb-sep { padding: 0 6px; opacity: .5; font-style: normal; }
.site-title .crumb-active { color: var(--accent-blue); }

.menu-btn {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--card-bg); border: none; box-shadow: var(--shadow-card);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.menu-btn svg { width: 18px; height: 18px; }
.menu-btn.is-close svg { width: 16px; height: 16px; }
.menu-btn__bars { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.menu-btn__bar { width: 18px; height: 2px; border-radius: 1px; background: #1c1c1c; }

.menu-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 100;
  overflow-y: auto; display: none;
}
.menu-overlay.is-open { display: block; }
.menu-tabs {
  display: flex; gap: 22px; padding: 4px var(--gutter) 18px;
  max-width: var(--container-max); margin: 0 auto; overflow-x: auto;
  font-size: 15px; color: var(--text-secondary); border-bottom: 1px solid var(--border-soft);
}
.menu-tabs a { white-space: nowrap; padding-bottom: 6px; }
.menu-tabs a.is-active { color: var(--text-primary); font-weight: 600; border-bottom: 2px solid var(--accent-pink); }
.menu-categories { max-width: var(--container-max); margin: 0 auto; padding: 8px var(--gutter) 40px; }
.menu-category { border-bottom: 1px solid var(--border-soft); }
.menu-category__head {
  width: 100%; background: none; border: none; padding: 16px 4px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-body); font-size: 17px; font-weight: 600;
  color: var(--text-primary); text-align: left;
}
.menu-category__head .chev { transition: transform .2s ease; }
.menu-category.is-open .menu-category__head .chev { transform: rotate(180deg); }
.menu-category__body { display: none; padding: 0 4px 18px; }
.menu-category.is-open .menu-category__body { display: block; }
.menu-entry { display: block; padding: 8px 0; font-size: 15px; }
.menu-entry.is-active { color: var(--accent-pink); font-weight: 600; }
.menu-entry:not(.is-active) { color: var(--text-secondary); }

.feed {
  max-width: var(--container-max); margin: 0 auto; padding: 6px var(--gutter) 60px;
  display: grid; grid-template-columns: 1fr; gap: 22px;
}
.card { background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; display: block; }
.card--hero { grid-column: 1 / -1; }
.card__media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
.card__media img { width: 100%; height: 100%; object-fit: cover; }

.hero-block {
  position: relative; aspect-ratio: 3 / 4; padding: 26px 22px 18px;
  display: flex; flex-direction: column; justify-content: flex-end; color: #fff;
}
.hero-block__lines {
  font-family: var(--font-body); font-weight: 800; text-transform: uppercase;
  line-height: 1.05; font-size: clamp(28px, 8vw, 40px); margin-bottom: auto;
}
.hero-block__lines .line--italic {
  font-style: italic; text-decoration: underline;
  text-decoration-thickness: 2px; text-underline-offset: 4px;
}
.hero-block__meta { margin-top: 18px; text-align: center; font-size: 11px; letter-spacing: .04em; }
.hero-block__issue { text-transform: uppercase; opacity: .9; margin-bottom: 4px; }
.hero-block__coauthors { font-style: italic; opacity: .95; }
.hero-block__coauthors a { text-decoration: underline; }

.card__body { padding: 18px 20px 20px; }
.card__title { font-family: var(--font-body); font-weight: 700; font-size: 18px; line-height: 1.3; margin: 0 0 8px; }
.card__excerpt { font-style: italic; color: var(--text-secondary); font-size: 14px; line-height: 1.45; margin: 0 0 14px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { background: var(--pill-bg); color: var(--pill-text); font-size: 12px; padding: 7px 14px; border-radius: var(--radius-pill); }

.media-placeholder {
  width: 100%; height: 100%;
  background: repeating-linear-gradient(45deg, #e2ded4, #e2ded4 10px, #ece9e0 10px, #ece9e0 20px);
  display: flex; align-items: center; justify-content: center;
  color: #a39f8f; font-size: 12px; text-align: center; padding: 12px;
}

.site-footer {
  max-width: var(--container-max); margin: 0 auto; padding: 30px var(--gutter) 50px;
  color: var(--text-secondary); font-size: 13px; text-align: center;
}

@media (min-width: 720px) {
  .feed { grid-template-columns: repeat(2, 1fr); gap: 28px; }
  .card--hero { grid-column: 1 / -1; }
  .card--hero .hero-block { aspect-ratio: 21 / 9; }
}
@media (min-width: 1040px) {
  .feed { grid-template-columns: repeat(3, 1fr); gap: 30px; }
}

@media (min-width: 1024px) {
  .site-header { padding: 0; }
  .site-header__brand { display: contents; }

  .site-logo-box {
    position: fixed; top: 10px; left: 10px;
    width: 55px; height: 50px; border-radius: 15px;
    background: #F4F4F4; border: 1px solid #F3EFFF;
    box-sizing: border-box; z-index: 50;
  }
  .site-logo { width: 26px; height: 26px; object-fit: contain; }

  .site-title {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 24px; line-height: 125%;
    letter-spacing: 0; color: #1A1A1A; white-space: nowrap; z-index: 50;
  }

  .menu-btn {
    position: fixed; top: 10px; right: 10px;
    width: 55px; height: 50px; border-radius: 15px;
    background: #F4F4F4; border: 1px solid #F3EFFF;
    box-sizing: border-box; box-shadow: none; z-index: 50;
  }
  .menu-btn__bars { gap: 6px; }
  .menu-btn__bar { width: 20px; height: 1px; border-radius: 0; background: #1A1A1A; }

  .feed { padding-top: 90px; }
}
</style>
</head>
<body>

  <header id="site-header" class="site-header"></header>

  <main class="feed" id="feed"></main>

  <footer class="site-footer">
    Rebuilding Creativity — © <span id="year"></span>
  </footer>

<script>
const CATEGORIES = [
  { id: "design", label: "Дизайн" },
  { id: "art", label: "Искусство" },
  { id: "music", label: "Музыка" },
  { id: "film", label: "Кино" },
  { id: "philosophy", label: "Философия" },
  { id: "other", label: "Прочее" },
];

const TOP_TABS = [
  { id: "new", label: "Новые Выпуски" },
  { id: "talks", label: "Разговоры" },
  { id: "articles", label: "Статьи" },
  { id: "about", label: "О проекте", href: "about.html" },
];

const INTERVIEWS = [
  {
    slug: "fatigue-burnout",
    category: "design",
    tags: ["Разговоры", "Советы", "Дизайн", "Философия"],
    issueNumber: 1,
    coauthors: [
      { name: "Настей Батальянц", url: "#" },
      { name: "Никитой Ивановым", url: "#" },
      { name: "Лизой Хлопс Хлопс", url: "#" },
    ],
    hero: {
      type: "color",
      color: "var(--accent-pink)",
      lines: ["FATIGUE BURNOUT", "КАК ПОБОРОТЬ", "УСТАЛОСТЬ?"],
      lastLineStyle: "italic-underline",
    },
    title: "Fatigue Burnout: Как побороть усталость?",
    excerpt: "Мы поговорили с дизайнерами и стилистами о том, как работать с выгоранием.",
  },
  {
    slug: "deconstructing-beauty",
    category: "design",
    tags: ["Разговоры", "Дизайн"],
    coauthors: [
      { name: "Ваней Казуковым", url: "#" },
      { name: "Степаном Липатовым", url: "#" },
    ],
    hero: { type: "image", image: "assets/images/deconstructing-beauty-cover.jpg" },
    title: 'Деконструкция красоты: Почему "неправильно" новое "круто"?',
    excerpt: "Обсудили с дизайнерами Ваней Казуковым и Степаном Липатовым, почему в 2026 году концепция «идеального дизайна» мертва.",
  },
  {
    slug: "berlin-festival-posters",
    category: "design",
    tags: ["Дизайн"],
    hero: { type: "image", image: "assets/images/berlin-festival-cover.jpg" },
    title: "Афиши для берлинского фестиваля",
    excerpt: "Обсудили создание афиш для берлинского фестиваля Yo-Fen с лайн-апом в 75 артистов.",
  },
];

const ICON_CHEV = `<svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
const ICON_CLOSE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>`;

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderHeader() {
  document.getElementById("site-header").innerHTML = `
    <a class="site-header__brand" href="index.html">
      <span class="site-logo-box">
        <img class="site-logo" src="assets/images/logo.png" alt="Rebuilding Creativity" onerror="this.style.display='none'">
      </span>
      <span class="site-title">Новые Выпуски</span>
    </a>
    <button class="menu-btn" id="menuToggle" aria-label="Открыть меню">
      <span class="menu-btn__bars">
        <span class="menu-btn__bar"></span>
        <span class="menu-btn__bar"></span>
        <span class="menu-btn__bar"></span>
      </span>
    </button>
  `;
  document.getElementById("menuToggle").addEventListener("click", openMenu);
}

function renderMenuCategory(cat) {
  const items = INTERVIEWS.filter((i) => i.category === cat.id);
  return `
    <div class="menu-category">
      <button class="menu-category__head" type="button">
        <span>${cat.label}</span>
        ${ICON_CHEV}
      </button>
      <div class="menu-category__body">
        ${items.length
          ? items.map((i) => `<a class="menu-entry" href="interview.html?slug=${i.slug}">${escapeHtml(i.title)}</a>`).join("")
          : `<span class="menu-entry" style="opacity:.5;">Пока пусто</span>`}
      </div>
    </div>
  `;
}

function renderMenuOverlay() {
  const overlayHtml = `
    <div class="menu-overlay" id="menuOverlay">
      <div class="site-header container" style="padding-left:0;padding-right:0;">
        <a class="site-header__brand" href="index.html">
          <span class="site-logo-box">
            <img class="site-logo" src="assets/images/logo.png" alt="" onerror="this.style.display='none'">
          </span>
          <span class="site-title" style="font-style:normal;font-family:var(--font-body);font-weight:600;font-size:16px;">Меню</span>
        </a>
        <button class="menu-btn is-close" id="menuClose" aria-label="Закрыть меню">${ICON_CLOSE}</button>
      </div>
      <nav class="menu-tabs">
        ${TOP_TABS.map(t => `<a href="${t.href || 'index.html'}" data-tab="${t.id}">${t.label}</a>`).join("")}
      </nav>
      <div class="menu-categories">
        ${CATEGORIES.map(renderMenuCategory).join("")}
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML("beforeend", overlayHtml);
  document.getElementById("menuClose").addEventListener("click", closeMenu);
  document.querySelectorAll(".menu-category__head").forEach((btn) => {
    btn.addEventListener("click", () => btn.closest(".menu-category").classList.toggle("is-open"));
  });
}

function openMenu() {
  document.getElementById("menuOverlay")?.classList.add("is-open");
  document.body.style.overflow = "hidden";
}
function closeMenu() {
  document.getElementById("menuOverlay")?.classList.remove("is-open");
  document.body.style.overflow = "";
}

function renderCard(item) {
  const mediaHtml = item.hero.type === "color"
    ? `
      <div class="hero-block" style="background:${item.hero.color};">
        <div class="hero-block__lines">
          ${item.hero.lines.map((line, idx) =>
            `<div class="${idx === item.hero.lines.length - 1 && item.hero.lastLineStyle === "italic-underline" ? "line--italic" : ""}">${escapeHtml(line)}</div>`
          ).join("")}
        </div>
        ${item.issueNumber ? `
          <div class="hero-block__meta">
            <div class="hero-block__issue">Выпуск ${item.issueNumber}</div>
            <div class="hero-block__coauthors">совместно с ${item.coauthors.map(c => `<a href="${c.url}">${escapeHtml(c.name)}</a>`).join(", ")}</div>
          </div>` : ""}
      </div>`
    : `
      <div class="card__media">
        <img src="${item.hero.image}" alt="${escapeHtml(item.title)}" onerror="this.parentElement.innerHTML='<div class=\\'media-placeholder\\'>Добавь изображение:<br>${item.hero.image}</div>'">
      </div>`;

  return `
    <a class="card ${item.hero.type === "color" ? "card--hero" : ""}" href="interview.html?slug=${item.slug}">
      ${mediaHtml}
      <div class="card__body">
        <h2 class="card__title">${escapeHtml(item.title)}</h2>
        <p class="card__excerpt">${escapeHtml(item.excerpt)}</p>
        <div class="tag-row">${item.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      </div>
    </a>
  `;
}

document.getElementById("year").textContent = new Date().getFullYear();
renderHeader();
renderMenuOverlay();
document.getElementById("feed").innerHTML = INTERVIEWS.map(renderCard).join("");
</script>
</body>
</html>
