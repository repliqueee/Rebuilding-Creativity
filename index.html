:root {
  --bg: #f2f0eb;
  --card-bg: #ffffff;
  --text-primary: #17161a;
  --text-secondary: #6b6a6f;
  --border-soft: #e6e3dc;

  --accent-pink: #f0227e;
  --accent-lime: #dcea55;
  --accent-blue: #4a5cf5;

  --pill-bg: #ececec;

  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;

  --radius-lg: 26px;

  --shadow-card: 0 6px 24px rgba(20, 18, 14, 0.06);
  --container-max: 1180px;
  --gutter: 20px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

.container { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); }

  align-items: center;

  overflow: hidden; box-sizing: border-box;
}
.site-logo { width: 100%; height: 100%; object-fit: cover; }
.site-title {
  font-family: var(--font-display);

  font-weight: 500;
  font-size: 22px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.site-title .crumb-sep { padding: 0 6px; opacity: .5; font-style: normal; }
.site-title .crumb-active { color: var(--accent-blue); }

}

.menu-btn.is-close svg { width: 16px; height: 16px; }

.menu-logo { display: none; }
